id = "pr-review-lsp"
name = "Pull Request Review"
version = "0.1.0"
schema_version = 1
authors = ["Tyler Agostino <17393035+TylerAgostino@users.noreply.github.com>"]
description = "Review pull requests and respond to review feedback directly in your buffers: inline comment highlights, tooltips, quick fixes, reactions, and review submission."
repository = "https://github.com/TylerAgostino/pr-lsp"
license = "MIT"

[[capabilities]]
kind = "process:exec"
command = "gh"
args = ["auth", "token"]

[[capabilities]]
kind = "npm:install"
package = "pr-review-lsp"

[language_servers.pr-review-lsp]
name = "Pull Request Review"
languages = ["Plain Text", "Markdown", "Rust", "Python", "JavaScript", "TypeScript", "TypeScript V2", "JSON", "JSONC", "YAML", "TOML", "HTML", "CSS", "Go", "C", "C++", "C#", "Java", "Ruby", "PHP", "Kotlin", "Elixir", "Shell Script", "Dockerfile"]
